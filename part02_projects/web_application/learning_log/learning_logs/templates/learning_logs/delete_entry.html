{% extends "learning_logs/base.html" %} {% block page_header %}
<div class="ll-form">
  <a
    class="ll-muted small text-decoration-none"
    href="{% url 'learning_logs:topic' topic.id %}"
  >
    <i class="bi bi-arrow-left me-1"></i>{{ topic.text }}
  </a>
  <h1 class="h2 mt-2 mb-4">Delete entry</h1>
</div>
{% endblock page_header %} {% block content %}
<div class="ll-form">
  <div class="ll-card p-4">
    <p class="mb-2">Are you sure you want to delete this entry?</p>
    <blockquote class="ll-entry ps-3 mb-2 ll-muted">
      {{ entry.text|truncatechars:80 }}
    </blockquote>
    <p class="ll-muted small mb-4">This cannot be undone.</p>
    <form
      action="{% url 'learning_logs:delete_entry' entry.id %}"
      method="post"
    >
      {% csrf_token %}
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-libra-danger" name="submit">
          <i class="bi bi-trash me-1"></i>Yes, delete
        </button>
        <a
          class="ll-cancel small"
          href="{% url 'learning_logs:topic' topic.id %}"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock content %}
